spring.application.name=faturamaroc-backend

# PostgreSQL Database Configuration (Auto-détecté par Spring Boot via l'URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/faturamaroc_db}
spring.datasource.username=postgres
spring.datasource.password=rootpassword

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson & Timezone (Maroc)
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Africa/Casablanca

# Security & JWT Configuration (clé secrète injectée via variable d'environnement en production)
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000
